name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  package:
    name: Build ${{ matrix.label }} app
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: Windows
            arch: x64
            artifact: greenpulse-windows
            files: out/make/**
          # DMGs can only be built on macOS. macos-latest is an Apple silicon runner;
          # it also builds the Intel app, since the app has no native code to compile.
          - runner: macos-latest
            label: macOS (Apple silicon)
            arch: arm64
            artifact: greenpulse-macos-apple-silicon
            files: out/make/dmg/**
          - runner: macos-latest
            label: macOS (Intel)
            arch: x64
            artifact: greenpulse-macos-intel
            files: out/make/dmg/**
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run desktop:make -- --arch=${{ matrix.arch }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
