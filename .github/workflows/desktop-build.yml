name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  package:
    name: Build ${{ matrix.label }} app
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: Windows
            artifact: greenpulse-windows
          - runner: macos-latest
            label: macOS
            artifact: greenpulse-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run desktop:make

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 14
